<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <style>
      @font-face{font-family:'Rubik Mono One';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
      .badge { cursor: pointer; }
      .badge .ring { transition: stroke-width .2s ease, fill .2s ease; }
      .badge text { fill: #111111; transition: fill .2s ease; }
      .badge:hover .ring { stroke-width: 5; fill: #2dd4bf22; }
      .badge:hover text { fill: #2dd4bf; }
    </style>
  </defs>
  <g class="badge">
    <circle class="ring" cx="80.0" cy="80.0" r="77.0" fill="#ffffff" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="80.0" y="72.0" text-anchor="middle" font-family="'Rubik Mono One', 'Courier New', monospace" font-size="30">art</text><text x="80.0" y="108.0" text-anchor="middle" font-family="'Rubik Mono One', 'Courier New', monospace" font-size="30">run</text>
  </g>
</svg>
